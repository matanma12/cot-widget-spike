<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Reasoning pattern library</title>
    <style>
      :root { color-scheme: light dark; --line: #88878055; --panel: #8887801a; }
      body { font-family: system-ui, sans-serif; margin: 0; padding: 14px; background: transparent; }
      h1 { font-size: 15px; font-weight: 600; margin: 0 0 2px; }
      #sub { font-size: 11.5px; opacity: 0.6; margin-bottom: 12px; }
      #cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 10px; }
      .card { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
      .card.unseen { opacity: 0.45; }
      .card h2 { font-size: 13px; font-weight: 600; margin: 0; display: flex; align-items: center; gap: 7px; }
      .anti-tag { font-size: 9.5px; font-weight: 600; letter-spacing: .05em; color: #993c1d; border: 1px solid #d85a30; border-radius: 4px; padding: 0 5px; }
      .freq { margin-left: auto; font-size: 11px; opacity: 0.6; font-weight: 400; }
      .glyph { display: flex; gap: 3px; margin: 7px 0; }
      .glyph i { width: 22px; height: 9px; border-radius: 3px; display: block; }
      .desc { font-size: 12px; line-height: 1.5; opacity: 0.85; }
      .learn { font-size: 12px; line-height: 1.5; margin-top: 6px; padding: 5px 9px; border-left: 3px solid #ef9f27; background: var(--panel); border-radius: 0 6px 6px 0; }
      .ex { font-size: 11.5px; margin-top: 7px; opacity: 0.7; font-style: italic; }
      @media (prefers-color-scheme: dark) { .anti-tag { color: #f5c4b3; } }
    </style>
  </head>
  <body>
    <h1>Reasoning pattern library</h1>
    <div id="sub">Loading…</div>
    <div id="cards"></div>
    <script type="module" src="/src/patterns-view.js"></script>
  </body>
</html>
