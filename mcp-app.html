<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Reasoning map</title>
    <style>
      :root { color-scheme: light dark; }
      body { font-family: system-ui, sans-serif; margin: 0; padding: 12px; background: transparent; }
      h1 { font-size: 15px; font-weight: 600; margin: 0 0 10px; }
      .strip { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
      .move { border: 1.5px solid; border-radius: 8px; padding: 6px 10px; font-size: 12.5px; cursor: pointer; background: transparent; text-align: left; }
      .move.active { outline: 2px solid currentColor; }
      .framing { color: #5f5e5a; border-color: #888780; }
      .hypothesis { color: #534ab7; border-color: #7f77dd; }
      .verification { color: #0f6e56; border-color: #1d9e75; }
      .backtrack { color: #993c1d; border-color: #d85a30; }
      .conclusion { color: #185fa5; border-color: #378add; }
      @media (prefers-color-scheme: dark) {
        .framing { color: #d3d1c7; } .hypothesis { color: #cecbf6; } .verification { color: #9fe1cb; } .backtrack { color: #f5c4b3; } .conclusion { color: #b5d4f4; }
      }
      #excerpt { font-size: 13px; line-height: 1.55; border-left: 3px solid #888780; padding: 4px 10px; min-height: 40px; opacity: 0.9; }
      #status { font-size: 11.5px; opacity: 0.6; margin-top: 10px; }
      #ping { margin-top: 8px; font-size: 12px; padding: 4px 10px; border-radius: 6px; border: 1px solid #888780; background: transparent; color: inherit; cursor: pointer; }
    </style>
  </head>
  <body>
    <h1 id="task">Reasoning map</h1>
    <div class="strip" id="strip"></div>
    <div id="excerpt">Click a move to see the original chain-of-thought excerpt.</div>
    <button id="ping">Re-fetch from server (round-trip test)</button>
    <div id="status">connecting to host…</div>
    <script type="module" src="/src/mcp-app.js"></script>
  </body>
</html>
